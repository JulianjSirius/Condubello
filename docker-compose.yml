services:
  postgres:
    image: postgres:15-alpine
    container_name: condubello_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - condubello_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Motor de rutas por calles (opcional). Prepara los datos una vez con docker/osrm/preparar-osrm.sh
  # y levántalo con: docker compose --profile routing up -d osrm
  osrm:
    image: osrm/osrm-backend:v5.25.0
    container_name: condubello_osrm
    profiles: ["routing"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-matching-size 1000 --max-viaroute-size 500 /data/colombia-latest.osrm
    volumes:
      - ./docker/osrm-data:/data:ro
    ports:
      - "${OSRM_PORT:-5001}:5000"

  # API interna: no se publica en el host, solo el gateway puede llegar a ella.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: condubello_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY (min. 32 caracteres) en .env}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@condubello.com}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD en .env}
      Osrm__BaseUrl: http://osrm:5000
      MapTiler__ApiKey: ${MAPTILER_API_KEY:-}
      Database__MigrateOnStartup: "true"
      DisableHttpsRedirection: "true"

  # Punto de entrada único: valida el JWT, centraliza el CORS y reenvía /api/* a la API.
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: condubello_gateway
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY (min. 32 caracteres) en .env}
      ReverseProxy__Clusters__api__Destinations__principal__Address: http://api:8080/
      Cors__Origins__0: http://localhost:${WEB_PORT:-8080}
    ports:
      - "${GATEWAY_PORT:-5000}:8080"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: condubello_web
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  condubello_postgres_data:

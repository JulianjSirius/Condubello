server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # El frontend llama directamente al gateway (ver Condubello.Web/src/app/core/config.ts);
  # este servidor solo entrega los archivos estáticos de la SPA.

  # SPA: cualquier ruta devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
